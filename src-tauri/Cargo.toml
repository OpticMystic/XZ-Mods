[package]
name = "xz-mods-builder"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "Independent XZ Mods USB and stem preparation tool"

[workspace]

[build-dependencies]
tauri-build = "2.5.6"

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false
codegen-units = 4
