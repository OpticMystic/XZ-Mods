[package]
name = "xz-mods-builder"
version = "0.5.0-preview.22.11"
edition = "2021"
license = "MIT"
description = "Independent XZ Mods USB and stem preparation tool"

[workspace]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications"] }

[profile.dev]
debug = 0
incremental = false
codegen-units = 4

[features]
updater-test = []
